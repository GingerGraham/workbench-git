name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_ref:
        description: "workbench-core ref to test against (default: main)"
        required: false

jobs:
  module-ci:
    # core_ref defaults to main, not module-ci.yml's own "latest published
    # release" default: this feature lives entirely under .github/, which
    # core's own release automation never version-bumps for (it only bumps
    # on changes to registered bin/lib/bootstrap.sh files) -- so a core
    # release containing this workflow will never exist to default to.
    # PILOT: temporarily pinned to workbench-core's CI-security-scanning
    # feature branch to test the new scan-secrets/scan-malware/scan-patterns
    # jobs before they exist on main. Flip back to @main once confirmed.
    uses: GingerGraham/workbench-core/.github/workflows/module-ci.yml@claude/zealous-davinci-yq9s21
    with:
      module_name: git
      core_ref: ${{ github.event.inputs.core_ref || 'main' }}
