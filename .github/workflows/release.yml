name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    # TODO: bump to @main once GingerGraham/workbench-core#33 (D40) merges.
    # Pinned to that PR's branch HEAD sha (reusable-workflow `uses:` refs
    # can't contain a "/", so the branch name itself can't be used here).
    uses: GingerGraham/workbench-core/.github/workflows/module-ci.yml@871bc70a5e3136e20d98cd63ec4a9174912e8efd
    with:
      module_name: git

  release:
    needs: ci
    # TODO: bump to @main and drop core_ref once GingerGraham/workbench-core#33 (D40) merges.
    uses: GingerGraham/workbench-core/.github/workflows/module-release.yml@871bc70a5e3136e20d98cd63ec4a9174912e8efd
    with:
      core_ref: claude/workbench-extension-ci-ska0he
    secrets: inherit
