# workbench.yml — workbench-git
#
# Ecosystem module (workbench-core ARCHITECTURE.md §2/§3): git identity and
# multi-context project management. Requires workbench-core only — works
# without any other workbench module.
#
# See contracts/manifest-spec.md (in workbench-core) for the full field
# reference.
version: 2
branch: main

core_api: ">=1.8 <2.0"
sync:
  enabled: true

info:
  description: "Git identity, multi-context project management, and CLI-wiring helpers"

deploy:
  # NOT ~/.config/git/ — that prefix is on workbench-core's dest denylist
  # (contracts/manifest-spec.md §dest validation), a deliberate trust
  # boundary, not an oversight. core.excludesfile/attributesfile point
  # here from files/gitconfig, through the gitconfig layer below — see
  # README.md's "File ownership" table.
  - src: files/attributes
    dest: ~/.local/share/workbench/modules/git/files/attributes
    mode: copy
    force: true
  - src: files/ignore
    dest: ~/.local/share/workbench/modules/git/files/ignore
    mode: copy
    force: true
  - src: files/workbench-git-context.sh
    dest: ~/.config/direnv/lib/workbench-git-context.sh
    mode: copy
    force: true

register:
  shell:
    - src: shell/git.sh
      tier: tools
    - src: shell/completions/gh.sh
      tier: tools
    - src: shell/completions/glab.sh
      tier: tools
  installers:
    - src: shell/installers.sh
  getters:
    - name: git
      function: get-git-functions
      label: "Git identity, project-context, and CLI-wiring helpers"

layers:
  # D82: workbench-core adds a block to your ~/.gitconfig that includes
  # these. Your own settings in ~/.gitconfig always win over the defaults.
  - tool: gitconfig
    src: files/gitconfig
    adopt: [files/legacy/gitconfig-hook]
  # Per-project identities you created with git-add-project — placed at the
  # end so they apply inside each project over your global identity.
  - tool: gitconfig
    src: files/gitconfig-contexts
    position: over
