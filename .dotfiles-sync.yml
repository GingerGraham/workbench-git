# .dotfiles-sync.yml — workbench-git
#
# Ecosystem module (workbench-core ARCHITECTURE.md §2/§3): git identity and
# multi-context project management. Meaningless standalone — depends on
# workbench-core's loader, Core API (elevation/_read_prompt/_str_lower,
# platform facts, installers-common.sh), and sync engine.
#
# See contracts/manifest-spec.md (in workbench-core) for the full field
# reference.
version: 1
branch: main

core_api: ">=1.1 <2.0"
sync:
  enabled: true

deploy:
  # NOT ~/.config/git/ — that prefix is on workbench-core's dest denylist
  # (contracts/manifest-spec.md §dest validation), a deliberate trust
  # boundary, not an oversight. core.excludesfile/attributesfile are set
  # by hooks/post-deploy.sh (and shell/git.sh's git-setup-identity) to
  # point here instead — see README.md's "File ownership" table.
  - src: files/attributes
    dest: ~/.local/share/workbench/modules/git/files/attributes
    mode: copy
    force: true
  - src: files/ignore
    dest: ~/.local/share/workbench/modules/git/files/ignore
    mode: copy
    force: true
  - src: files/workbench-git-context.sh
    dest: ~/.config/direnv/lib/workbench-git-context.sh
    mode: copy
    force: true

register:
  shell:
    - src: shell/git.sh
      tier: tools
    - src: shell/completions/gh.sh
      tier: tools
    - src: shell/completions/glab.sh
      tier: tools
  installers:
    - src: shell/installers.sh
  getters:
    - name: git
      function: get-git-functions
      label: "Git identity, project-context, and CLI-wiring helpers"

hooks:
  post_deploy:
    command: ["hooks/post-deploy.sh"]
    run_on: initial
    timeout: 60
